<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saavdhaan Family</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200..600&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f2362b' d='M12 2.2 4.2 5.1v6.1c0 4.9 3.3 9.2 7.8 10.6 4.5-1.4 7.8-5.7 7.8-10.6V5.1z'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #04131a; --card: #eef7f6; --ink: #e6f2f2; --dim: #7f9ca1;
      --teal: #2ec4c0; --sindoor: #ff4b4b; --coal: #0b1a1f;
      font-family: "Jost", "Anek Devanagari", "Nirmala UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); padding: 20px 16px 40px;
           background: radial-gradient(circle 260px at 50% 30%, rgba(46,196,192,.14), transparent 72%),
                       radial-gradient(ellipse 120% 60% at 50% -10%, rgba(46,196,192,.08), transparent 70%), var(--bg);
           background-attachment: fixed; transition: background-color .6s ease; }
    body.alarm { background: radial-gradient(circle 260px at 50% 30%, rgba(255,75,75,.18), transparent 72%), #1e0709;
                 background-attachment: fixed; }
    header { display: flex; align-items: center; gap: 10px; font-weight: 300; font-size: 1.1rem;
             letter-spacing: .32em; text-transform: uppercase; }
    header svg { width: 26px; height: 26px; fill: var(--sindoor); }
    .conn { margin: 14px 0 22px; padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(238,242,255,.25);
            font-size: .95rem; color: var(--dim); display: inline-flex; gap: 8px; align-items: center; }
    .conn i { width: 10px; height: 10px; border-radius: 50%; background: #666; display: inline-block; }
    .conn.on i { background: var(--teal); }
    .conn.off i { background: var(--sindoor); }
    .idle { font-size: 1.4rem; line-height: 1.4; color: var(--dim); max-width: 30ch; }
    button { font: inherit; font-weight: 400; font-size: .85rem; letter-spacing: .28em; text-transform: uppercase;
             border: 1px solid rgba(46,196,192,.6); border-radius: 999px; padding: 13px 22px;
             background: transparent; color: var(--teal); margin: 0 0 22px; cursor: pointer; }
    button:disabled { opacity: .7; cursor: default; }
    .conn { background: rgba(255,255,255,.025); border-color: rgba(46,196,192,.22); }
    .card { background: var(--card); color: var(--coal); border-radius: 18px; padding: 18px; margin-bottom: 14px;
            border-left: 10px solid var(--sindoor); }
    .card h2 { margin: 0 0 6px; font-size: 1.45rem; }
    .card .when { font-size: .9rem; color: #5b6070; }
    .card p { font-size: 1.1rem; line-height: 1.45; margin: 10px 0; }
    .card ul { margin: 6px 0 0; padding-left: 20px; }
    .card blockquote { margin: 8px 0 0; padding: 8px 12px; background: #f1e4c8; border-radius: 8px; font-size: 1rem; }
    .card.ended { border-left-color: var(--teal); }
    .card .act { display: block; margin-top: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2 4.2 5.1v6.1c0 4.9 3.3 9.2 7.8 10.6 4.5-1.4 7.8-5.7 7.8-10.6V5.1z"/></svg>
    Saavdhaan Family
  </header>
  <div class="conn" id="conn"><i></i><span id="conn-text">Connecting…</span></div>
  <div><button id="sound" type="button">Turn on alert sound</button></div>
  <div id="feed">
    <p class="idle" id="idle">Keep this page open. If someone in your family gets a scam call, the alert appears here immediately.</p>
  </div>
<script>
"use strict";
const feed = document.getElementById("feed");
const idle = document.getElementById("idle");
const conn = document.getElementById("conn");
const connText = document.getElementById("conn-text");
const soundBtn = document.getElementById("sound");
let audio = null;
let retry = 1000;

soundBtn.addEventListener("click", () => {
  audio = new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  soundBtn.textContent = "Alert sound on";
  soundBtn.disabled = true;
});

function chime() {
  if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 400]);
  if (!audio) return;
  const t = audio.currentTime;
  for (let i = 0; i < 3; i++) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = i % 2 ? 660 : 880;
    g.gain.setValueAtTime(0.0001, t + i * 0.35);
    g.gain.exponentialRampToValueAtTime(0.4, t + i * 0.35 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.35 + 0.3);
    o.connect(g).connect(audio.destination);
    o.start(t + i * 0.35); o.stop(t + i * 0.35 + 0.32);
  }
}

function el(tag, text, cls) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function setConn(state, text) {
  conn.className = "conn " + state;
  connText.textContent = text;
}

function onAlert(m) {
  idle.hidden = true;
  document.body.classList.add("alarm");
  const card = el("section", undefined, "card");
  card.append(el("h2", "Possible scam call right now"),
              el("div", new Date().toLocaleTimeString() + (typeof m.t_ms === "number" ? ` · ${Math.round(m.t_ms / 1000)} s into the call` : ""), "when"),
              el("p", m.text || ""));
  if (Array.isArray(m.tactics) && m.tactics.length) {
    const ul = el("ul");
    m.tactics.forEach((t) => ul.append(el("li", t)));
    card.append(ul);
  }
  (m.evidence || []).slice(0, 2).forEach((q) => card.append(el("blockquote", `“${q}”`)));
  card.append(el("span", "Call them now. If money or an OTP was shared, call 1930.", "act"));
  feed.prepend(card);
  chime();
}

function onEnded(m) {
  document.body.classList.remove("alarm");
  const card = el("section", undefined, "card ended");
  card.append(el("h2", "That call has ended"),
              el("div", new Date().toLocaleTimeString(), "when"),
              el("p", `Peak scam risk ${m.peak_score ?? "?"} of 100. Check on them and make sure nothing was paid or shared.`));
  feed.prepend(card);
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/family`);
  ws.onopen = () => { retry = 1000; setConn("on", "Connected. Waiting for alerts."); };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === "alert") onAlert(m);
    else if (m.type === "call_ended") onEnded(m);
  };
  ws.onclose = () => {
    setConn("off", `Disconnected. Reconnecting in ${Math.round(retry / 1000)} s…`);
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 15000);
  };
}
connect();
</script>
</body>
</html>
